name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap:
    name: Bootstrap script checks
    runs-on: ubuntu-latest
    env:
      FIXTURE_HOME: /tmp/dsh-fixture-home
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check
        run: |
          bash -n setup-dsh.sh
          bash -n reset.sh

      - name: ShellCheck
        run: shellcheck --severity=style --exclude=SC2088 setup-dsh.sh reset.sh

      - name: Embedded sync tool matches sync-models.js
        run: |
          awk 'index($0, "> sync-models.js") && index($0, "cat <<") {flag=1; next} flag && $0 == "EOF" {flag=0; next} flag' setup-dsh.sh > /tmp/embedded.js
          test -s /tmp/embedded.js
          diff -u /tmp/embedded.js sync-models.js

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Smoke test sync-models.js (fresh, rerun, missing anchor)
        run: |
          mkdir -p "$FIXTURE_HOME/.dsh"
          # Reproduce exactly the patch file setup-dsh.sh writes (without the model list)
          awk 'index($0, "cordis.patch.yml") && index($0, "cat <<") {flag=1; next} flag && $0 == "EOF" {flag=0; next} flag' setup-dsh.sh > "$FIXTURE_HOME/.dsh/cordis.patch.yml"
          test -s "$FIXTURE_HOME/.dsh/cordis.patch.yml"

          # Start deterministic local model catalog mock server
          MOCK_PORT=3899
          bun -e '
            Bun.serve({
              port: 3899,
              fetch() {
                return Response.json({
                  data: [
                    { id: "deepseek/deepseek-chat", name: "DeepSeek: DeepSeek V3" },
                    { id: "openai/gpt-4o", name: "OpenAI: GPT-4o" },
                    { id: "anthropic/claude-3.5-sonnet", name: "Anthropic: Claude 3.5 Sonnet" }
                  ]
                });
              }
            });
          ' &
          MOCK_PID=$!
          sleep 0.5

          export OPENROUTER_MODELS_URL="http://127.0.0.1:$MOCK_PORT"

          HOME="$FIXTURE_HOME" bun sync-models.js
          cp "$FIXTURE_HOME/.dsh/cordis.patch.yml" /tmp/after1.yml

          # Re-run must be a byte-identical no-op (idempotency)
          HOME="$FIXTURE_HOME" bun sync-models.js
          diff /tmp/after1.yml "$FIXTURE_HOME/.dsh/cordis.patch.yml"

          # Missing anchors must fail loudly
          sed -i '/# Route default model to OpenRouter/d; /- id: agent-default-model/d' "$FIXTURE_HOME/.dsh/cordis.patch.yml"
          if HOME="$FIXTURE_HOME" bun sync-models.js; then
            echo "::error::sync-models.js succeeded although the patch anchor was removed"
            kill $MOCK_PID 2>/dev/null || true
            exit 1
          fi

          kill $MOCK_PID 2>/dev/null || true

      - name: doctor.js fails loudly without credentials (negative test)
        run: |
          if HOME=/tmp/dsh-doctor-empty bun doctor.js; then
            echo "::error::doctor.js should exit non-zero when no credentials are present"
            exit 1
          fi

      - name: doctor.js validates credential permissions (fails on 0644, passes on 0600)
        run: |
          PERM_FIXTURE=/tmp/dsh-doctor-perm
          rm -rf "$PERM_FIXTURE"
          mkdir -p "$PERM_FIXTURE/.dsh"
          chmod 700 "$PERM_FIXTURE/.dsh"
          cp "$FIXTURE_HOME/.dsh/cordis.patch.yml" "$PERM_FIXTURE/.dsh/cordis.patch.yml"
          echo "llm-pi-ai: { providers: { openrouter: {} } }" > "$PERM_FIXTURE/.dsh/settings.yaml"
          cat << 'EOF' > "$PERM_FIXTURE/.dsh/.credentials.yaml"
          version: 1
          refs:
            OPENROUTER_API_KEY: "sk-or-v1-test-token"
          EOF

          # Case 1: chmod 644 must trigger fatal permission failure
          chmod 644 "$PERM_FIXTURE/.dsh/.credentials.yaml"
          OUTPUT_644="$(DSH_HOME="$PERM_FIXTURE/.dsh" bun doctor.js 2>&1 || true)"
          if ! echo "$OUTPUT_644" | grep -q "fatal: must be 0600"; then
            echo "::error::doctor.js should fail with fatal permission check on 0644"
            exit 1
          fi

          # Case 2: chmod 600 must pass permission check
          chmod 600 "$PERM_FIXTURE/.dsh/.credentials.yaml"
          OUTPUT_600="$(DSH_HOME="$PERM_FIXTURE/.dsh" bun doctor.js 2>&1 || true)"
          if ! echo "$OUTPUT_600" | grep -q "mode 0600"; then
            echo "::error::doctor.js should verify mode 0600"
            exit 1
          fi

      - name: Generated patch is valid YAML
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 <<'PY'
          import yaml

          doc = yaml.safe_load(open("/tmp/after1.yml"))
          assert isinstance(doc, list) and len(doc) >= 5, "unexpected patch structure"
          assert any(
              isinstance(e, dict) and "openrouter" in str(e.get("config", {})) for e in doc
          ), "openrouter provider block missing"
          print("patch YAML OK:", len(doc), "entries; openrouter block present")
          PY

      - name: create-dsh-template.sh generates valid template structure
        run: |
          TEMPLATE_DIR=/tmp/test-dsh-template
          rm -rf "$TEMPLATE_DIR"
          bash create-dsh-template.sh "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/package.json"
          test -f "$TEMPLATE_DIR/setup-dsh.sh"
          test -f "$TEMPLATE_DIR/doctor.js"
          test -f "$TEMPLATE_DIR/sync-models.js"
          test -f "$TEMPLATE_DIR/.dsh/cordis.patch.yml"
          test -x "$TEMPLATE_DIR/setup-dsh.sh"
          test -x "$TEMPLATE_DIR/sync-models.js"
          grep -q "agent-default-model" "$TEMPLATE_DIR/.dsh/cordis.patch.yml"
          rm -rf "$TEMPLATE_DIR"

      - name: reset.sh target-resolution and safety verification suite
        run: |
          # Test A: Custom directory reset (--dir)
          CUSTOM_TARGET=/tmp/dsh-custom-test-reset
          rm -rf "$CUSTOM_TARGET"
          mkdir -p "$CUSTOM_TARGET"
          touch "$CUSTOM_TARGET/cordis.patch.yml" "$CUSTOM_TARGET/settings.yaml"
          bash reset.sh --dir "$CUSTOM_TARGET" --force
          test ! -d "$CUSTOM_TARGET"

          # Test B: Global protection on default reset in mock workspace (hermetic without DSH_HOME)
          MOCK_WS=/tmp/dsh-mock-ws
          GLOBAL_MOCK=/tmp/dsh-global-mock
          rm -rf "$MOCK_WS" "$GLOBAL_MOCK"
          mkdir -p "$MOCK_WS" "$GLOBAL_MOCK/.dsh"
          cp reset.sh "$MOCK_WS/reset.sh"
          touch "$GLOBAL_MOCK/.dsh/cordis.patch.yml"
          echo "global" > "$MOCK_WS/.dsh-target"
          (cd "$MOCK_WS" && HOME="$GLOBAL_MOCK" env -u DSH_HOME bash reset.sh --force)
          test ! -f "$MOCK_WS/.dsh-target"
          test -f "$GLOBAL_MOCK/.dsh/cordis.patch.yml"
          rm -rf "$MOCK_WS" "$GLOBAL_MOCK"

          # Test C: DSH_HOME environment variable precedence
          ENV_TARGET=/tmp/dsh-env-precedence-target
          rm -rf "$ENV_TARGET"
          mkdir -p "$ENV_TARGET"
          touch "$ENV_TARGET/cordis.patch.yml"
          DSH_HOME="$ENV_TARGET" bash reset.sh --force
          test ! -d "$ENV_TARGET"

          # Test D: Sentinel verification aborts on non-DSH directory
          UNRELATED_DIR=/tmp/unrelated-reset-guard
          rm -rf "$UNRELATED_DIR"
          mkdir -p "$UNRELATED_DIR"
          touch "$UNRELATED_DIR/user-file.txt"
          if bash reset.sh --dir "$UNRELATED_DIR" --force; then
            echo "::error::reset.sh should abort on non-DSH directory without sentinels"
            exit 1
          fi
          test -f "$UNRELATED_DIR/user-file.txt"
          rm -rf "$UNRELATED_DIR"
